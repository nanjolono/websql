<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Connect to Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">Connect to Database</h1>
    <form action="/" method="post" class="row g-3">
        <div class="col-md-6">
            <label for="ip" class="form-label">IP Address:</label>
            <input type="text" class="form-control" id="ip" name="ip" required>
        </div>
        <div class="col-md-6">
            <label for="user" class="form-label">User:</label>
            <input type="text" class="form-control" id="user" name="user" required>
        </div>
        <div class="col-md-6">
            <label for="password" class="form-label">Password:</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <div class="col-md-6">
            <label for="dbname" class="form-label">Database Name:</label>
            <input type="text" class="form-control" id="dbname" name="dbname" required>
        </div>
        <div class="col-md-6">
            <label for="driver" class="form-label">Database Driver:</label>
            <select class="form-select" id="driver" name="driver" required>
                <option value="mysql">MySQL</option>
                <option value="postgres">PostgreSQL</option>
                <option value="oracle">Oracle</option>
            </select>
        </div>
        <div class="col-12">
            <button type="submit" class="btn btn-primary">Connect</button>
        </div>
    </form>
</div>
</body>
</html>
